[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphshield-fraud"
version = "0.1.0"
description = "Leakage-resistant graph neural network experiments for financial fraud detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torch-geometric>=2.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
stacking = ["lightgbm>=4.0"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
